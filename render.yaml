# Render.com Blueprint – New > Blueprint > vyber tento repozitár
services:
  - type: web
    name: vajicka
    runtime: node
    plan: starter            # disk (trvalé dáta) vyžaduje platený plán
    region: frankfurt
    buildCommand: "true"     # žiadne závislosti
    startCommand: node server.js
    healthCheckPath: /api/bootstrap
    envVars:
      - key: DATA_DIR
        value: /data
      - key: TEAMS_WEBHOOK_URL
        sync: false          # zadáš v Renderi
      - key: ADMIN_PIN
        sync: false
      - key: APP_URL
        sync: false
    disk:
      name: vajicka-data
      mountPath: /data
      sizeGB: 1
