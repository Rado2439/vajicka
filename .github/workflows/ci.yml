name: Testy
on:
  push:
    branches: [main]
  pull_request:
jobs:
  databaza:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Testy databázy
        run: psql -X -q -v ON_ERROR_STOP=1 -f test/net-stub.sql -f supabase/databaza.sql -f test/databaza.test.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kontrola JavaScriptu
        run: for f in docs/*.js demo/mock.js; do node --check "$f"; done
